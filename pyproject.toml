#
# Packaging for the `aotriton` code-generation package, which lives under python/.
# `aotriton` is a PEP 420 namespace package: `python/` maps to every
# aotriton.<subpkg> except tune, which is its own distribution
# (python/tune/setup.py) merging into the same namespace at import time. The
# version is read from CMakeLists.txt (the single source of truth); dynamic
# metadata + package mapping are computed in setup.py.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aotriton"
dynamic = ["version"]
description = "AOTriton ahead-of-time Triton code generator"
requires-python = ">=3.10"

# No console scripts: the generator tools are invoked as `python -m aotriton.<tool>`
# (e.g. `python -m aotriton.generate`) — not as installed binaries.

[tool.pytest.ini_options]
testpaths = [
    "python/test", "python/pytest-gpu-lease/tests",
    # Only these two files, not all of python/tune/tests/: test_exaid.py in
    # there needs a real GPU and torch, unlike these.
    "python/tune/tests/test_tune_infra.py", "python/tune/tests/test_gpu_utils_amdsmi.py",
]
# GPU integration tests live under modules/flash/tests/ and require hardware; keep them separate.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
