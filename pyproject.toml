#
# Packaging for the `aotriton` code-generation package, which lives under python/.
# `aotriton` is a PEP 420 implicit namespace package: `python/` maps to only PART
# of it (every aotriton.<subpkg> except tune) — see setup.py. `python/tune/` is a
# separate distribution (python/tune/setup.py, package name `aotriton-tune`) that
# merges into the same namespace at import time. The version is read from
# CMakeLists.txt (the single source of truth). Dynamic metadata + the package
# mapping are computed in setup.py because the directory layout (python/ ->
# aotriton, with sub-dirs as aotriton.<subpkg>) needs programmatic package_dir.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aotriton"
dynamic = ["version"]
description = "AOTriton ahead-of-time Triton code generator"
requires-python = ">=3.10"

# No console scripts: the generator tools are invoked as `python -m aotriton.<tool>`
# (e.g. `python -m aotriton.generate`) — not as installed binaries.

[tool.pytest.ini_options]
testpaths = ["python/test", "python/pytest-gpu-lease/tests"]
# GPU integration tests live under modules/flash/tests/ and require hardware; keep them separate.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
