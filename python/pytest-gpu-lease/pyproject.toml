#
# A standalone distribution living inside python/, which otherwise maps to the
# `aotriton` package. Safe because the repo-root setup.py uses find_packages(), which
# does not descend into directories lacking __init__.py -- and this directory has none.
# Keep it that way: find_namespace_packages() would sweep this package into the
# aotriton wheel (see the note at setup.py's find_packages call).

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-gpu-lease"
version = "0.1.0"
description = "Lease one GPU per pytest-xdist worker via fcntl byte-range locks"
requires-python = ">=3.10"
classifiers = [
    "Framework :: Pytest",  # standard practice for pytest plugins
]
dependencies = [
    # `_announce` reaches into _pytest.capture (see plugin.py) because no public,
    # session-scoped way to suspend capture exists. If a future pytest moves it,
    # the announcement silently degrades to captured-and-replayed -- pin an upper
    # bound here at that point.
    "pytest",
    # Not imported and no fixture of its own is required (see _workerinput in
    # plugin.py) -- but leasing is the whole point of this package, and without
    # xdist every run silently falls back to GPU 0.
    "pytest-xdist>=1.15",
]

[project.entry-points.pytest11]
gpu_lease = "pytest_gpu_lease.plugin"

[tool.setuptools]
packages = ["pytest_gpu_lease"]
