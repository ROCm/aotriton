venvs:
  gfx117x:
    hash: f1d8a285813c1de43aeb122adc6ae89df246e768
    origin: https://github.com/triton-lang/triton
  gfx1250:
    pep508: triton==3.9.0
rules:
  - rmatches:
      arch: '^gfx117[01]$'
    venv: gfx117x
  - rmatches:
      arch: '^gfx1250(-strict)?$'
    venv: gfx1250
  # gfx1100 is retuned; gfx1101-gfx1103 copy its tuning cells. gfx115x stays
  # on the default Triton until gfx1100's database is settled.
  - rmatches:
      arch: '^gfx110[0-3]$'
    venv: gfx1250
