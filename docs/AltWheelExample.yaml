# Resolved-format AltWheel YAML: consumed directly by CMake via
# -DAOTRITON_ALT_TRITON_WHEEL_CONFIG_FILE (python/codegen/root.py's
# _load_altwheel_config). Every venvs.* entry is a string in one of three
# forms, decided by its prefix (python/altwheel.py parses it for both readers):
#
#   <path>.whl              bare: a Triton wheel, pip-installed into a fresh
#                           venv altvenvs/<name>. Must end in ".whl"; a relative
#                           path resolves against the build directory.
#   python:<interpreter>    an existing Python executable (some venv's
#                           bin/python, or a system one), absolute path, used
#                           as is: no venv is created and nothing is installed.
#                           CMake checks at configure time that it can
#                           `import triton`.
#   pep508:<requirement>    any PEP 508 requirement pip accepts, pip-installed
#                           into a fresh venv altvenvs/<name>. Changing it
#                           reinstalls Triton on the next build.
#
# A bare value that is not a .whl path (e.g. "triton==3.9.0") is an error;
# write it as "pep508:triton==3.9.0".
#
# CMake requires venvs.default. Unless it is "python:", its Triton is also
# installed into the main build venv. It compiles every Triton kernel no rule
# matches. FlyDSL kernels always compile in the main build venv.
#
# This is normally produced automatically -- .ci/common-altwheel.sh's
# altwheel_resolve_config rewrites a hash/origin-form yaml (the format .ci's
# wheel-building scripts consume, documented at .ci/AltWheelExample.yaml)
# into this form once the wheels are built. Write one by hand only for a
# fully manual workflow against already-built wheels.
venvs:
  default: /cache/wheels/triton-3.4.0+git6b70e716-cp310-cp310-linux_x86_64.whl
  navi3x: /cache/wheels/triton-3.3.0+git4280ed11-cp310-cp310-linux_x86_64.whl
  vllm: python:/opt/venvs/vllm-triton/bin/python
  # Quoting is optional here, but required once a value holds ": " or " #".
  gfx1250: 'pep508:triton==3.9.0; python_version >= "3.10"'
rules:
  - gmatches:  # glob matches
      family: sparse_*
    venv: vllm
  - matches:  # String matches (identical)
      arch: gfx1100
    venv: navi3x
  - rmatches:  # Regex Matching
      arch: gfx110.
    venv: navi3x
  - matches:
      arch: gfx1250
    venv: gfx1250

# NOT IMPLEMENTED: a *sequence* form, installing several requirements into one
# venv in order, e.g. a per-venv flydsl pin (today every venv gets the
# third_party/flydsl-compiler.txt pin). Each item would take the same forms as a
# non-"python:" scalar entry:
#
# venvs:
#   vllm:
#     - /cache/wheels/triton-3.4.0+git6b70e716-cp310-cp310-linux_x86_64.whl
#     - pep508:flydsl==0.3.2
#
# FlyDSL from a git reference would not work there: its setup.py needs a
# prebuilt bundled MLIR, so use a version pin from an index or a prebuilt wheel.
# python/altwheel.py is the one place to add it; CMake reads entries through it.
